name: Android APK

# Builds a debug APK for side loading and republishes a single rolling pre-release
# so there is always exactly one download available.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # One rolling tag. Every successful build replaces the release behind it.
  RELEASE_TAG: pre-release

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      file_name: ${{ steps.version.outputs.file_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version stamp counts commits, so a shallow clone stamps a wrong env.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # v3 still defaults to installing "tools platform-tools", and the obsolete
      # `tools` package was removed from the SDK repository, so the default aborts
      # the whole run. Pin the packages we actually need instead.
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          # Space separated, not a yaml list: the action forwards this straight to
          # sdkmanager as one argument and does not split on newlines.
          packages: 'platform-tools platforms;android-37'

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # The APK is the point of this workflow, so read the stamp out of the built
      # manifest rather than re-deriving it: assembling already bumped the pack
      # counter, so a separately computed version would disagree with what shipped.
      - name: Stamp the artifact
        id: version
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"

          badging="$("$aapt2" dump badging "$apk")"
          version_name="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          short_sha="$(git rev-parse --short=8 HEAD)"

          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "could not read a version out of the built APK" >&2
            exit 1
          fi

          # One tag cannot hold two releases, and repeats of the same commit share a
          # version stamp, so the run number keeps downloads distinguishable on disk.
          file_name="gits-${version_name}-build${GITHUB_RUN_NUMBER}-${short_sha}.apk"
          mkdir -p dist
          cp "$apk" "dist/$file_name"

          {
            echo "version_name=$version_name"
            echo "version_code=$version_code"
            echo "short_sha=$short_sha"
            echo "file_name=$file_name"
          } >> "$GITHUB_OUTPUT"

          echo "Built $file_name (versionCode $version_code)"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Republish rolling pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
      FILE_NAME: ${{ needs.build.outputs.file_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist

      - name: Replace the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          notes="$(cat <<EOF
          Rolling pre-release, replaced on every successful build.

          - version \`$VERSION_NAME\` (versionCode \`$VERSION_CODE\`)
          - commit \`$SHORT_SHA\`
          - run $GITHUB_RUN_NUMBER, branch \`${GITHUB_REF_NAME}\`

          Install with \`adb install -r\` or copy the APK to a device and open it.
          EOF
          )"

          # --cleanup-tag as well, or the tag survives and the next create fails.
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" "dist/$FILE_NAME" \
            --title "Gits $VERSION_NAME" \
            --notes "$notes" \
            --prerelease

          echo "Published $FILE_NAME to the $RELEASE_TAG pre-release"
